<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <html>

    <body>
        <form method="post">

            <fieldset>


                <table>
                    <h2>Donor Information</h2>

                    <tr>
                        <td><label for="firstname">First Name*</label></td>
                        <td><input type="text" id="firstname" name="firstname" required></td>
                    </tr>

                    <tr>
                        <td><label for="lastname">Last Name*</label></td>
                        <td><input type="text" id="lastname" name="lastname" required></td>
                    </tr>


                    <tr>
                        <td><label for="company">Company</label></td>
                        <td><input type="text" id="company" name="company" required></td>
                    </tr>

                    <tr>
                        <td><label for="address1">Address 1*</label></td>
                        <td><input type="text" id="address1" name="address1" required></td>
                    </tr>

                    <tr>
                        <td><label for="address2">Address 2</label></td>
                        <td><input type="text" id="address2" name="address2" required></td>
                    </tr>

                    <tr>
                        <td><label for="city*">City*</label></td>
                        <td><input type="text" id="city*" name="city*" required></td>
                    </tr>
                    <tr>
                        <td> <label for="state*">State*</label></td>
                        <td>
                            <select id="state*" name="state*" required>
                                <option>Select a State</option>
                                <option>Dhaka</option>
                                <option>Chittagong</option>
                                <option>Bandarban</option>
                                <option>Sylhet</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="zipcode*">Zip Code*</label></td>
                        <td><input type="text" id="zipcode*" name="zipcode*" required></td>
                    </tr>

                    <tr>
                        <td> <label for="country">Country</label></td>
                        <td>
                            <select id="country" name="country" required>
                                <option>Select a country</option>
                                <option>Bangladesh</option>
                                <option>India</option>
                                <option>USA</option>
                                <option>UK</option>
                            </select>
                        </td>
                    </tr>


                    <tr>
                        <td><label for="phone">Phone</label></td>
                        <td><input type="text" id="phone" name="phone" required></td>
                    </tr>


                    <tr>
                        <td><label for="fax">Fax</label></td>
                        <td><input type="text" id="fax" name="fax" required></td>
                    </tr>

                    <tr>
                        <td><label for="email">Email*</label></td>
                        <td><input type="email" id="email" name="email" required></td>
                    </tr>


                    <tr>
                        <td><label>Donation Amount*<br>(Check a button or type in your amount)</label></td>
                        <td>
                            <input type="radio" name="donation" value="none">None
                            <input type="radio" name="donation" value="50"> $50
                            <input type="radio" name="donation" value="75"> $75
                            <input type="radio" name="donation" value="100"> $100
                            <input type="radio" name="donation" value="250"> $250
                            <input type="radio" name="donation" value="other"> Other

                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td><label for="otheramount">Other Amount$</label></td>
                        <td><input type="text" id="otheramount" name="otheramount" required></td>
                    </tr>


                    <tr>
                        <td><label>Recurring Donation<br>(Check if yes)</label></td>
                        <td>
                            <input type="checkbox" name="recurringdonation" value="check">I am interested in giving on a
                            regular basis.
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td><label for="monthlycreditcard">Monthly credit card$</label></td>
                        <td><input type="text" id="monthlycreditcard" name="monthlycreditcard" required></td>
                        <td><label for="for">For</label></td>
                        <td><input type="text" id="for" name="for" required></td>
                        <td><label for="months">Months</label></td>
                        <td><input type="text" id="months" name="months" required></td>


                    </tr>
                </table>

                <table>
                    <h2>Honorium and Memorial Donation Information</h2>

                    <tr>
                        <td><label>I would like to make this donation</label></td>
                        <td>
                            <input type="radio" name="hmdonation" value="tohonor"> To Honor
                            <input type="radio" name="hmdonation" value="inmemoryof"> In Memory of
                        </td>
                    </tr>
                    <tr>
                        <td><label for="hmname">Name*</label></td>
                        <td><input type="text" id="hmname" name="hmname" required></td>
                    </tr>

                    <tr>
                        <td><label for="acknowledgedonationto">Acknowledge Donation to</label></td>
                        <td><input type="text" id="acknowledgedonationto" name="acknowledgedonationto" required></td>
                    </tr>

                    <tr>
                        <td><label for="address">Address</label></td>
                        <td><input type="text" id="address" name="address" required></td>
                    </tr>

                    <tr>
                        <td><label for="city">City</label></td>
                        <td><input type="text" id="city" name="city" required></td>
                    </tr>

                    <tr>
                        <td> <label for="state">State</label></td>
                        <td>
                            <select id="state" name="state" required>
                                <option>Select a State</option>
                                <option>Dhaka</option>
                                <option>Chittagong</option>
                                <option>Bandarban</option>
                                <option>Sylhet</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="zip">Zip</label></td>
                        <td><input type="text" id="zip" name="zip" required></td>
                    </tr>
                </table>
                <table>
                    <input type="Reset">
                    <input type="Submit" value="Continue">

                </table>




            </fieldset>


    </body>

    </html>
